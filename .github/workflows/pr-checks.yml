name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # post/update the PR summary comment

jobs:
  # ── macOS unit + stress + logger tests ───────────────────────────────────────
  test-macos:
    name: macOS Tests
    runs-on: macos-26
    defaults:
      run:
        working-directory: src/macos
    steps:
      - uses: actions/checkout@v4

      - name: Require the macOS 26 SDK
        run: |
          # Liquid Glass is compiled in only against the macOS 26 SDK (the code
          # sits behind #if compiler(>=6.2)). An older Xcode builds cleanly and
          # ships an app with no glass at all, so fail loudly here instead.
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "$(xcodebuild -version | tr '\n' ' ')| SDK $sdk | $(swift --version 2>&1 | head -1)"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::macOS SDK $sdk is older than 26: this build would ship without Liquid Glass."
            exit 1
          fi

      - name: Cache Swift build artifacts
        uses: actions/cache@v4
        with:
          path: src/macos/.build
          # The image is in the key: .build artefacts compiled by another
          # toolchain must never be restored onto this one.
          key: swift-macos-26-${{ hashFiles('src/macos/Package.swift') }}
          restore-keys: swift-macos-26-

      - name: Check generated design tokens are current
        run: python3 ../../scripts/design/gen_tokens.py --check

      - name: Run full Swift test suite
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee ../../test-output-macos.txt
          exit ${PIPESTATUS[0]}

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-diagnostics-macos-${{ github.run_id }}
          path: test-output-macos.txt
          retention-days: 7
          if-no-files-found: ignore

  # ── Windows unit + stress + logger tests ─────────────────────────────────────
  test-windows:
    name: Windows Tests
    runs-on: windows-2022
    defaults:
      run:
        working-directory: src/windows-native
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/windows-native/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Check generated design tokens are current
        run: python ..\..\scripts\design\gen_tokens.py --check

      - name: Restore dependencies
        run: msbuild /t:Restore /p:Configuration=Release /p:Platform=x64 LanMessenger.sln

      - name: Build test project
        shell: pwsh
        run: |
          msbuild LanMessenger.Tests\LanMessenger.Tests.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            2>&1 | Tee-Object -FilePath ..\..\test-output-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run full test suite
        shell: pwsh
        run: |
          $testDll = Get-ChildItem -Path "LanMessenger.Tests\bin" `
                       -Filter "LanMessenger.Tests.dll" -Recurse |
                     Select-Object -First 1
          if (-not $testDll) { Write-Error "Test DLL not found"; exit 1 }
          dotnet vstest $testDll.FullName `
            --logger:"console;verbosity=normal" `
            --logger:"trx;LogFileName=PRTestResults.trx" `
            2>&1 | Tee-Object -Append -FilePath ..\..\test-output-windows.txt
          exit $LASTEXITCODE

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-results-windows-${{ github.run_id }}
          path: src/windows-native/LanMessenger.Tests/TestResults/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-diagnostics-windows-${{ github.run_id }}
          path: test-output-windows.txt
          retention-days: 7
          if-no-files-found: ignore

  # ── Post / update a single PR summary comment ─────────────────────────────────
  comment:
    name: Post PR Summary
    needs: [test-macos, test-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post or update check comment
        uses: actions/github-script@v7
        with:
          script: |
            const mac = '${{ needs.test-macos.result }}';
            const win = '${{ needs.test-windows.result }}';
            const icon = r => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const allPassed = mac === 'success' && win === 'success';

            const body = [
              '<!-- pr-ci-check -->',
              `## ${allPassed ? '✅ All checks passed' : '❌ One or more checks failed'}`,
              '',
              '| Platform | Tests |',
              '|----------|-------|',
              `| 🍎 macOS   | ${icon(mac)} ${mac} |`,
              `| 🪟 Windows | ${icon(win)} ${win} |`,
              '',
              '> Includes: unit tests, crypto round-trips, frame codec, logger multi-channel,',
              '> concurrent write stress, rotation budget, and message-status regression checks.',
              '',
              `[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('<!-- pr-ci-check -->')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
