<!-- @dsCard group="Foundations" height=250 subtitle="The one material: clear, regular, thick" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>GlassSurface — preview</title></head>
<body style="margin:0">
<div class="lm-stage" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-content:center">
  <div style="position:absolute;left:18%;top:28%;width:180px;height:120px;border-radius:30px;background:var(--brand);opacity:.55"></div>
  <div style="position:absolute;left:58%;top:18%;width:120px;height:120px;border-radius:50%;background:var(--avatar-blue);opacity:.45"></div>
  <div class="lm-glass lm-glass--clear" style="position:relative;border-radius:var(--radius-panel);padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px">
    <strong style="font-size:14px">Clear</strong><span style="font-size:11px;color:var(--ink-secondary)">glass-clear · blur 12</span><span style="font-size:11px;color:var(--ink-secondary)">Icon buttons over content</span></div>
  <div class="lm-glass" style="position:relative;border-radius:var(--radius-panel);padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px">
    <strong style="font-size:14px">Regular</strong><span style="font-size:11px;color:var(--ink-secondary)">glass-regular · blur 24</span><span style="font-size:11px;color:var(--ink-secondary)">Header, composer, sidebar</span></div>
  <div class="lm-glass lm-glass--thick" style="position:relative;border-radius:var(--radius-panel);padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px">
    <strong style="font-size:14px">Thick</strong><span style="font-size:11px;color:var(--ink-secondary)">glass-thick · blur 40</span><span style="font-size:11px;color:var(--ink-secondary)">Sheets, menus, settings</span></div>
</div>
</body>
</html>
