<!-- @dsCard group="Controls" height=360 subtitle="Grouped rows on thick glass" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SettingsGroup — preview</title></head>
<body style="margin:0">
<div class="lm-stage"><div class="lm-settings">
  <span class="lm-settings__header">Startup</span>
  <div class="lm-settings__group lm-glass lm-glass--thick">
    <div class="lm-settings__row"><span class="lm-settings__label">Launch at login</span><span class="lm-toggle"><input type="checkbox" id="s-login" checked aria-label="Launch at login"><span class="lm-toggle__track"></span><span class="lm-toggle__knob"></span></span></div>
    <div class="lm-settings__row"><span class="lm-settings__label">Show in Dock<span class="lm-settings__hint">The menu bar icon stays either way.</span></span><span class="lm-toggle"><input type="checkbox" id="s-dock" aria-label="Show in Dock"><span class="lm-toggle__track"></span><span class="lm-toggle__knob"></span></span></div>
  </div>
  <span class="lm-settings__header" style="margin-top:8px">Files</span>
  <div class="lm-settings__group lm-glass lm-glass--thick">
    <div class="lm-settings__row"><span class="lm-settings__label">Received files</span><span class="lm-settings__value">~/Downloads/LAN Messenger</span><button class="lm-button lm-button--plain">Change…</button></div>
    <div class="lm-settings__row"><span class="lm-settings__label">Screenshots</span><span class="lm-settings__value">Default</span><button class="lm-button lm-button--plain">Change…</button></div>
  </div>
</div></div>
</body>
</html>
