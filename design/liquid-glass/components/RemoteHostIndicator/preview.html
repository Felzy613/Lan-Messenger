<!-- @dsCard group="Remote desktop" height=190 subtitle="A neutral HUD: colour only in the dot and the Stop button" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>RemoteHostIndicator — preview</title></head>
<body style="margin:0">
<div class="lm-stage lm-stack" style="align-items:center;justify-content:center;gap:16px">
  <div class="lm-indicator" role="status" aria-label="Priya is viewing your screen, 4 minutes 12 seconds"><span class="lm-indicator__dot"></span><span class="lm-indicator__headline">Priya is viewing your screen</span><span class="lm-indicator__elapsed">4:12</span><span class="lm-indicator__sep"></span><button class="lm-indicator__btn lm-indicator__btn--stop">Stop Sharing</button></div>
  <div class="lm-indicator lm-indicator--controlled" role="status" aria-label="Priya is controlling your screen, 6 minutes 48 seconds"><span class="lm-indicator__dot"></span><span class="lm-indicator__headline">Priya is controlling your screen</span><span class="lm-indicator__elapsed">6:48</span><span class="lm-indicator__sep"></span><button class="lm-indicator__btn">Stop Control</button><button class="lm-indicator__btn lm-indicator__btn--stop">Stop Sharing</button></div>
</div>
</body>
</html>
