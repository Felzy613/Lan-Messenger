<!doctype html>
<html>
<head><meta charset="utf-8"><title>RemoteHostIndicator — preview</title></head>
<body style="margin:0">
<div class="lm-stage lm-stack" style="align-items:center">
  <div class="lm-indicator" role="status"><span class="lm-indicator__dot"></span><span class="lm-indicator__text"><span class="lm-indicator__headline">Priya is viewing your screen</span><span class="lm-indicator__elapsed">04:12</span></span><button class="lm-indicator__btn">Stop Sharing</button></div>
  <div class="lm-indicator lm-indicator--controlled" role="status"><span class="lm-indicator__dot"></span><span class="lm-indicator__text"><span class="lm-indicator__headline">Priya is controlling your Mac</span><span class="lm-indicator__elapsed">06:48</span></span><button class="lm-indicator__btn">Stop Control</button><button class="lm-indicator__btn">Stop Sharing</button></div>
</div>
</body>
</html>
