<!doctype html>
<html>
<head><meta charset="utf-8"><title>IconButton — preview</title></head>
<body style="margin:0">
<div class="lm-stage lm-inline" style="gap:28px">
  <div class="lm-inline" style="gap:4px"><button class="lm-icon-button" aria-label="Attach a file"><svg class="lm-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5l-8.3 8.3a5 5 0 0 1-7.1-7.1l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg></button><button class="lm-icon-button" aria-label="Take a screenshot"><svg class="lm-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg></button><button class="lm-icon-button" disabled aria-label="Remote desktop unavailable"><svg class="lm-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button></div>
  <div class="lm-toolbar-group lm-glass"><button class="lm-icon-button" aria-label="New message"><svg class="lm-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button><button class="lm-icon-button" aria-label="Contacts"><svg class="lm-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg></button><button class="lm-icon-button" aria-label="Settings"><svg class="lm-icon " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M2.5 12h3M18.5 12h3M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button></div>
  <button class="lm-icon-button lm-glass lm-glass--clear" aria-label="Jump to latest"><svg class="lm-icon " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
</div>
</body>
</html>
